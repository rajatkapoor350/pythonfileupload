name: Scheduled AWS Glue Job

on:
  schedule:
    - cron: '30 2 * * *'  # Schedule to run at 2:30 AM UTC (8:00 AM IST) every day
  workflow_dispatch:  # Optional: still allows manual triggering if needed

jobs:
  trigger-glue-job:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v2

      # Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Test AWS CLI
      - name: Verify AWS CLI and region
        run: |
          aws sts get-caller-identity
          echo "Region: ${{ secrets.AWS_REGION }}"

      # Start the Glue job
      - name: Start AWS Glue job
        run: |
          aws glue start-job-run --job-name partitioningdata
